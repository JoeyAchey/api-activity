[project]
name = "api-activity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joey Achey", email = "joey.achey@drake.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-restful>=0.3.10",
    "requests>=2.34.2",
]

[project.scripts]
api-activity = "api_activity:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
